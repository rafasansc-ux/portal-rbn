name: Coletor legado manual

on:
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install feedparser

      - name: Rodar coletor
        run: python coletor_cloud.py

      - name: Salvar noticias.json no repositório
        run: |
          git config user.name "RBN Bot"
          git config user.email "bot@rbnfm.com.br"
          git add noticias.json historico.json
          git diff --staged --quiet || git commit -m "Boletim automático $(date -u '+%d/%m/%Y %H:%Mh')"
          git push

